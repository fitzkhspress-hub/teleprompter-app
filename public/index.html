<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mode Selection Screen */
        .mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .mode-selection h1 {
            font-size: 48px;
            margin-bottom: 12px;
            text-align: center;
        }

        .mode-selection p {
            font-size: 18px;
            margin-bottom: 48px;
            opacity: 0.9;
            text-align: center;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 600px;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-4px);
        }

        .mode-btn-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
        }

        .session-info {
            font-size: 14px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .config-section {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .config-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .config-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }

        .input-group input,
        .input-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .script-textarea {
            flex: 1;
            padding: 20px;
            border: none;
            font-size: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .controls-section {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .control-btn {
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .control-btn.secondary:hover {
            background: #d0d0d0;
        }

        .status-message {
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f0f4ff;
            border-bottom: 1px solid #d9e1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-message.connected {
            background: #f0fdf4;
            color: #166534;
            border-bottom-color: #dcfce7;
        }

        .status-message.error {
            background: #fef2f2;
            color: #991b1b;
            border-bottom-color: #fee2e2;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Display Mode */
        .display-mode {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .teleprompter-screen {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .teleprompter-content {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 40px;
            color: white;
            font-size: 42px;
            line-height: 1.8;
            font-family: 'Georgia', serif;
            scroll-behavior: smooth;
            text-align: center;
        }

        .teleprompter-content::-webkit-scrollbar {
            width: 8px;
        }

        .teleprompter-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .teleprompter-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .teleprompter-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .display-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90vw;
        }

        .teleprompter-screen:hover .display-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .display-controls button {
            padding: 10px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .display-controls button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .display-controls button:active {
            transform: translateY(0);
        }

        .display-info-top {
            font-size: 12px !important;
        }

        .display-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Monaco', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .display-status.connected {
            color: #4ade80;
        }

        .display-status.disconnected {
            color: #ef4444;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 12px;
        }

        .speed-control label {
            font-size: 13px;
            white-space: nowrap;
        }

        .speed-control input {
            width: 100px;
        }

        .footer-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'Monaco', monospace;
        }

        .display-count {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Monaco', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class TeleprompterApp {
            constructor() {
                this.mode = null;
                this.sessionId = this.generateSessionId();
                this.script = localStorage.getItem('teleprompter_script') || '';
                this.serverUrl = this.getServerUrl();
                this.scrollPosition = 0;
                this.isPlaying = false;
                this.scrollSpeed = 1;
                this.isConnected = false;
                this.displayCount = 0;
                this.isMirrored = localStorage.getItem('teleprompter_mirror') === 'true' || false;
                this.fontSize = parseInt(localStorage.getItem('teleprompter_fontsize')) || 42;
                this.savedScripts = this.loadSavedScripts();
                this.ws = null;
                this.clientType = null;
                this.useWebSocket = true;
                this.syncInterval = null;
                this.init();
            }

            loadSavedScripts() {
                const saved = localStorage.getItem('teleprompter_saved_scripts');
                return saved ? JSON.parse(saved) : [];
            }

            persistSavedScripts() {
                localStorage.setItem('teleprompter_saved_scripts', JSON.stringify(this.savedScripts));
            }

            generateSessionId() {
                if (typeof localStorage !== 'undefined') {
                    let sessionId = localStorage.getItem('teleprompter_session');
                    if (!sessionId) {
                        // Generate short, easy-to-type session code (6 uppercase chars)
                        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // No 0, 1, I, O to avoid confusion
                        let code = '';
                        for (let i = 0; i < 6; i++) {
                            code += chars.charAt(Math.floor(Math.random() * chars.length));
                        }
                        sessionId = code;
                        localStorage.setItem('teleprompter_session', sessionId);
                    }
                    return sessionId;
                }
                return 'TEMP' + Math.random().toString(36).substr(2, 4).toUpperCase();
            }

            getServerUrl() {
                if (typeof localStorage !== 'undefined') {
                    return localStorage.getItem('teleprompter_server') || window.location.origin;
                }
                return window.location.origin;
            }

            init() {
                this.render();
            }

            connectWebSocket() {
                if (this.ws) this.ws.close();

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}?sessionId=${this.sessionId}&type=${this.clientType}`;

                try {
                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.render();
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);

                            if (message.type === 'connected') {
                                this.isConnected = true;
                                if (message.currentState) {
                                    this.script = message.currentState.script || this.script;
                                    this.isPlaying = message.currentState.isPlaying || false;
                                    this.scrollSpeed = message.currentState.scrollSpeed || 1;
                                    this.displayCount = message.currentState.displayCount || 0;
                                }
                                this.render();
                            } else if (message.type === 'sync') {
                                // Display mode received sync from control
                                if (this.clientType === 'display') {
                                    this.script = message.script || this.script;
                                    this.isPlaying = message.isPlaying;
                                    this.scrollSpeed = message.scrollSpeed || 1;

                                    const content = document.querySelector('.teleprompter-content');
                                    if (content && this.isPlaying && message.isPlaying) {
                                        // Auto-scroll if playing
                                        content.scrollTop += this.scrollSpeed * 2;
                                    }
                                    this.render();
                                }
                            } else if (message.type === 'displayCount') {
                                this.displayCount = message.count;
                                this.render();
                            } else if (message.type === 'broadcast_sent') {
                                this.displayCount = message.displayCount;
                                this.render();
                            }
                        } catch (error) {
                            console.error('Error parsing WebSocket message:', error);
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.isConnected = false;
                        this.useWebSocket = false;
                        this.startPolling();
                    };

                    this.ws.onclose = () => {
                        this.isConnected = false;
                        // Attempt to reconnect after 3 seconds
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                } catch (error) {
                    console.error('Error creating WebSocket:', error);
                    this.useWebSocket = false;
                    this.startPolling();
                }
            }

            startPolling() {
                if (this.syncInterval) clearInterval(this.syncInterval);

                this.syncInterval = setInterval(() => {
                    if (this.clientType === 'display') {
                        this.pollServerData();
                    } else if (this.clientType === 'control') {
                        this.broadcastViaRest();
                    }
                }, 1000);
            }

            async pollServerData() {
                try {
                    const response = await fetch(`/api/session/${this.sessionId}`);
                    if (response.ok) {
                        const data = await response.json();
                        this.isConnected = true;
                        this.script = data.script || this.script;
                        this.isPlaying = data.isPlaying;
                        this.scrollSpeed = data.scrollSpeed || 1;

                        const content = document.querySelector('.teleprompter-content');
                        if (content && this.isPlaying) {
                            content.scrollTop += this.scrollSpeed * 2;
                        }
                        this.render();
                    }
                } catch (error) {
                    this.isConnected = false;
                }
            }

            async broadcastViaRest() {
                const displayArea = document.querySelector('.script-textarea');
                if (displayArea) {
                    this.script = displayArea.value;
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem('teleprompter_script', this.script);
                    }
                }

                try {
                    const response = await fetch(`/api/session/${this.sessionId}/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            script: this.script,
                            scrollPosition: this.scrollPosition,
                            isPlaying: this.isPlaying,
                            scrollSpeed: this.scrollSpeed
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        this.isConnected = true;
                        this.displayCount = data.displayCount || 0;
                        this.render();
                    }
                } catch (error) {
                    this.isConnected = false;
                }
            }

            showSessionInput() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="mode-selection">
                        <h1>📡 Join Display Session</h1>
                        <p>Enter the 6-letter code from the control device</p>
                        <div style="background: rgba(255,255,255,0.1); padding: 40px; border-radius: 12px; max-width: 450px;">
                            <div style="margin-bottom: 24px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px;">
                                <label style="display: block; font-size: 12px; margin-bottom: 12px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;">This Device's Session Code</label>
                                <div style="font-size: 48px; font-weight: 700; font-family: monospace; text-align: center; letter-spacing: 8px; word-spacing: 20px;">${this.sessionId}</div>
                                <p style="font-size: 11px; text-align: center; margin-top: 8px; opacity: 0.7;">Use this if you're the Control device</p>
                            </div>
                            
                            <div style="border-top: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); padding: 24px 0; margin: 24px 0;">
                                <label style="display: block; font-size: 12px; margin-bottom: 12px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;">Join an Existing Session</label>
                                <p style="font-size: 12px; margin-bottom: 16px; opacity: 0.8;">Read the 6-letter code from the control device screen and type it below:</p>
                                <input type="text" id="sessionInput" placeholder="Type 6-letter code (e.g., BEAM42)" 
                                    maxlength="6"
                                    oninput="this.value = this.value.toUpperCase()"
                                    style="width: 100%; padding: 16px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; font-family: monospace; font-size: 24px; text-align: center; letter-spacing: 4px; font-weight: 600;">
                            </div>
                            
                            <button onclick="app.joinSession()" style="width: 100%; padding: 16px; background: #667eea; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 16px; transition: all 0.2s; margin-bottom: 12px;">
                                ✓ Join as Display
                            </button>
                            <button onclick="app.setMode(null)" style="width: 100%; padding: 14px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s;">
                                ← Back
                            </button>
                        </div>
                    </div>
                `;
                setTimeout(() => {
                    const input = document.getElementById('sessionInput');
                    if (input) input.focus();
                }, 100);
            }

            joinSession() {
                const input = document.getElementById('sessionInput');
                if (input && input.value.trim()) {
                    // User entered a session ID - use it
                    this.sessionId = input.value.trim();
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem('teleprompter_session', this.sessionId);
                    }
                }
                // Now enter display mode with the session ID (either new one or entered one)
                this.setMode('display');
            }

            setMode(mode) {
                this.mode = mode;
                this.clientType = mode; // 'control' or 'display'

                if (mode === 'control' || mode === 'display') {
                    this.connectWebSocket();
                    if (!this.useWebSocket) {
                        this.startPolling();
                    }
                } else if (this.ws) {
                    this.ws.close();
                }

                this.render();
            }

            updateScript(text) {
                this.script = text;
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_script', this.script);
                }

                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'update',
                        data: { script: this.script }
                    }));
                }
            }

            togglePlayback() {
                this.isPlaying = !this.isPlaying;
                this.broadcast();
            }

            resetScroll() {
                this.scrollPosition = 0;
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop = 0;
                }
                this.broadcast();
            }

            updateSpeed(speed) {
                this.scrollSpeed = parseFloat(speed);
                this.broadcast();
            }

            updateServerUrl(url) {
                this.serverUrl = url;
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_server', url);
                }
            }

            broadcast() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'update',
                        data: {
                            script: this.script,
                            scrollPosition: this.scrollPosition,
                            isPlaying: this.isPlaying,
                            scrollSpeed: this.scrollSpeed
                        }
                    }));
                }
            }

            scrollUp() {
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop -= 100;
                }
            }

            scrollDown() {
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop += 100;
                }
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_mirror', this.isMirrored);
                }
                this.render();
            }

            changeFontSize(delta) {
                this.fontSize = Math.max(20, Math.min(80, this.fontSize + delta));
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_fontsize', this.fontSize);
                }
                this.render();
            }

            saveScript(name) {
                if (!name || !name.trim()) {
                    alert('Please enter a script name');
                    return;
                }

                const scriptEntry = {
                    id: Date.now(),
                    name: name.trim(),
                    content: this.script,
                    savedAt: new Date().toLocaleString()
                };

                // Check if name already exists
                const existingIndex = this.savedScripts.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
                if (existingIndex >= 0) {
                    if (confirm(`Script "${name}" already exists. Overwrite?`)) {
                        this.savedScripts[existingIndex] = scriptEntry;
                    } else {
                        return;
                    }
                } else {
                    this.savedScripts.push(scriptEntry);
                }

                this.persistSavedScripts();
                alert(`Script "${name}" saved! ✓`);
                this.render();
            }

            loadScript(id) {
                const scriptEntry = this.savedScripts.find(s => s.id === id);
                if (scriptEntry) {
                    this.script = scriptEntry.content;
                    localStorage.setItem('teleprompter_script', this.script);
                    this.broadcast();
                    this.render();
                }
            }

            deleteScript(id) {
                const scriptEntry = this.savedScripts.find(s => s.id === id);
                if (scriptEntry && confirm(`Delete "${scriptEntry.name}"?`)) {
                    this.savedScripts = this.savedScripts.filter(s => s.id !== id);
                    this.persistSavedScripts();
                    this.render();
                }
            }

            downloadScript(id) {
                const scriptEntry = this.savedScripts.find(s => s.id === id);
                if (scriptEntry) {
                    const element = document.createElement('a');
                    element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(scriptEntry.content));
                    element.setAttribute('download', `${scriptEntry.name}.txt`);
                    element.style.display = 'none';
                    document.body.appendChild(element);
                    element.click();
                    document.body.removeChild(element);
                }
            }

            render() {
                const app = document.getElementById('app');

                if (!this.mode) {
                    app.innerHTML = `
                        <div class="mode-selection">
                            <h1>📺 Teleprompter</h1>
                            <p>Choose your role</p>
                            <div class="mode-buttons">
                                <button class="mode-btn" onclick="app.setMode('control')">
                                    <div class="mode-btn-icon">🎮</div>
                                    <div>Control</div>
                                </button>
                                <button class="mode-btn" onclick="app.showSessionInput()">
                                    <div class="mode-btn-icon">📡</div>
                                    <div>Display</div>
                                </button>
                            </div>
                            <div style="margin-top: 40px; text-align: center; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; max-width: 300px; margin-left: auto; margin-right: auto;">
                                <p style="font-size: 11px; opacity: 0.8; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 1px;">Session Code</p>
                                <p style="font-size: 36px; font-weight: 700; margin: 0; font-family: monospace; letter-spacing: 4px;">${this.sessionId}</p>
                                <p style="font-size: 10px; opacity: 0.7; margin: 8px 0 0 0;">Display devices type this code to join</p>
                            </div>
                        </div>
                    `;
                } else if (this.mode === 'control') {
                    this.renderControlPanel(app);
                } else if (this.mode === 'display') {
                    this.renderDisplayMode(app);
                }
            }

            renderControlPanel(app) {
                const statusClass = this.isConnected ? 'connected' : 'error';
                const statusText = this.isConnected ? `Connected • ${this.displayCount} display${this.displayCount !== 1 ? 's' : ''}` : 'Connecting...';

                app.innerHTML = `
                    <div class="control-panel">
                        <div class="header">
                            <h1>📡 Control Panel</h1>
                            <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                                <div class="session-info">
                                    <span class="status-dot" style="background: ${this.isConnected ? '#10b981' : '#ef4444'};"></span>
                                    Session: <code style="background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 3px; font-family: monospace; cursor: pointer;" onclick="navigator.clipboard.writeText('${this.sessionId}'); alert('Session ID copied!');" title="Click to copy">${this.sessionId.substr(-8)}</code>
                                </div>
                                <button class="back-btn" onclick="app.setMode(null)">← Back</button>
                            </div>
                        </div>

                        <div class="status-message ${statusClass}">
                            <span class="status-dot"></span>
                            ${statusText}
                        </div>

                        <div class="config-section" style="background: #e8eaff; border-bottom-color: #d9e1ff;">
                            <h3 style="color: #3c366b;">📤 Share with Display Devices</h3>
                            <div style="background: white; padding: 16px; border-radius: 8px; margin-bottom: 12px; text-align: center;">
                                <p style="font-size: 11px; color: #666; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 1px;">Session Code</p>
                                <p style="font-size: 32px; font-weight: 700; margin: 0; font-family: monospace; letter-spacing: 3px; color: #667eea;">${this.sessionId}</p>
                                <p style="font-size: 10px; color: #999; margin: 8px 0 0 0;">Have displays read this code and type it in</p>
                            </div>
                            <button onclick="navigator.clipboard.writeText('${this.sessionId}'); alert('Session code copied!')" style="width: 100%; padding: 10px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;">
                                📋 Copy Code
                            </button>
                            <p style="font-size: 11px; color: #5a5a7a; margin-top: 12px;">Display devices: Click Display mode and type this 6-letter code (no copy/paste needed)</p>
                        </div>

                        <div class="editor-section">
                            <div class="editor-header">
                                <h3>Script</h3>
                                <span style="font-size: 12px; color: #999;">${this.script.split('\n').length} lines</span>
                            </div>
                            <textarea class="script-textarea" 
                                placeholder="Paste or type your script here..."
                                oninput="app.updateScript(this.value)">${this.script}</textarea>
                        </div>

                        <div class="controls-section">
                            <button class="control-btn" onclick="app.togglePlayback()">
                                ${this.isPlaying ? '⏸ Pause' : '▶ Play'}
                            </button>
                            <button class="control-btn secondary" onclick="app.resetScroll()">
                                ↻ Reset
                            </button>
                            <button class="control-btn secondary" onclick="app.broadcast()">
                                📤 Sync
                            </button>

                            <div class="speed-control" style="grid-column: 1 / -1;">
                                <label for="speedSlider">Scroll Speed:</label>
                                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" 
                                    value="${this.scrollSpeed}" onchange="app.updateSpeed(this.value)">
                                <span id="speedValue" style="font-size: 12px; min-width: 30px;">${this.scrollSpeed.toFixed(1)}x</span>
                            </div>

                            <div style="grid-column: 1 / -1; border-top: 1px solid #ddd; padding-top: 12px;">
                                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                                    <input type="text" id="scriptName" placeholder="Script name..." 
                                        style="flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;">
                                    <button onclick="const name = document.getElementById('scriptName').value; app.saveScript(name); document.getElementById('scriptName').value = '';" 
                                        class="control-btn secondary" style="white-space: nowrap;">
                                        💾 Save
                                    </button>
                                </div>

                                ${this.savedScripts.length > 0 ? `
                                    <div style="background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; padding: 12px; max-height: 150px; overflow-y: auto;">
                                        <p style="font-size: 11px; font-weight: 600; margin: 0 0 8px 0; color: #666;">Saved Scripts (${this.savedScripts.length})</p>
                                        ${this.savedScripts.map(script => `
                                            <div style="display: flex; gap: 6px; align-items: center; padding: 6px; background: white; border-radius: 4px; margin-bottom: 6px; font-size: 12px;">
                                                <span style="flex: 1; font-weight: 500; color: #333;">${script.name}</span>
                                                <button onclick="app.loadScript(${script.id})" style="padding: 4px 8px; background: #10b981; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">Load</button>
                                                <button onclick="app.downloadScript(${script.id})" style="padding: 4px 8px; background: #3b82f6; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">↓</button>
                                                <button onclick="app.deleteScript(${script.id})" style="padding: 4px 8px; background: #ef4444; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 11px;">✕</button>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : `
                                    <p style="font-size: 12px; color: #999; text-align: center; padding: 12px 0; margin: 0;">No saved scripts yet. Save one to get started!</p>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            renderDisplayMode(app) {
                const statusClass = this.isConnected ? 'connected' : 'disconnected';
                const statusText = this.isConnected ? 'Connected' : 'Connecting...';
                const mirrorStyle = this.isMirrored ? 'transform: scaleX(-1);' : '';

                app.innerHTML = `
                    <div class="display-mode">
                        <div class="teleprompter-screen">
                            <div class="teleprompter-content" id="teleContent" style="font-size: ${this.fontSize}px; ${mirrorStyle}">
                                ${this.script ? this.script : '<em style="opacity: 0.5;">Waiting for script...</em>'}
                            </div>
                            <div class="display-controls">
                                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                                    <button onclick="app.scrollUp()">↑ Scroll</button>
                                    <button onclick="app.scrollDown()">↓ Scroll</button>
                                    <button onclick="app.changeFontSize(-4)" style="min-width: 40px;">A−</button>
                                    <button onclick="app.changeFontSize(4)" style="min-width: 40px;">A+</button>
                                    <button onclick="app.toggleMirror()" style="background: ${this.isMirrored ? '#4ade80' : '#667eea'};">🔄 Mirror</button>
                                    <button onclick="app.setMode(null)">← Exit</button>
                                </div>
                            </div>
                        </div>
                        <div class="display-status ${statusClass}">
                            ● ${statusText}
                        </div>
                        <div class="display-info-top" style="position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-family: monospace;">
                            ${this.sessionId} | Font: ${this.fontSize}px | ${this.isMirrored ? '🔄 Mirrored' : 'Normal'}
                        </div>
                        <div class="footer-info">
                            Use arrow buttons to adjust font (A− / A+) • Mirror for beam splitter display
                        </div>
                    </div>
                `;
            }
        }

        const app = new TeleprompterApp();
        window.app = app;
    </script>
</body>
</html>
