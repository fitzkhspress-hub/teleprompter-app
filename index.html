<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* Mode Selection Screen */
        .mode-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .mode-selection h1 {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .mode-selection p {
            font-size: 18px;
            margin-bottom: 48px;
            opacity: 0.9;
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            max-width: 600px;
        }

        .mode-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-4px);
        }

        .mode-btn-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
        }

        .session-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .editor-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .script-textarea {
            flex: 1;
            padding: 20px;
            border: none;
            font-size: 16px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .controls-section {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .control-btn {
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .control-btn.secondary {
            background: #e0e0e0;
            color: #333;
        }

        .control-btn.secondary:hover {
            background: #d0d0d0;
        }

        .status-message {
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #666;
            background: #f0f4ff;
            border-bottom: 1px solid #d9e1ff;
        }

        .status-message.connected {
            background: #f0fdf4;
            color: #166534;
            border-bottom-color: #dcfce7;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 12px;
        }

        .speed-control label {
            font-size: 13px;
            white-space: nowrap;
        }

        .speed-control input {
            width: 100px;
        }

        /* Display Mode */
        .display-mode {
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .teleprompter-screen {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .teleprompter-content {
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 40px;
            color: white;
            font-size: 42px;
            line-height: 1.8;
            font-family: 'Georgia', serif;
            scroll-behavior: smooth;
            text-align: center;
        }

        .teleprompter-content::-webkit-scrollbar {
            width: 8px;
        }

        .teleprompter-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .teleprompter-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .display-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .teleprompter-screen:hover .display-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .display-controls button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .display-controls button:hover {
            background: #5568d3;
        }

        .display-controls button.mirror-active {
            background: #10b981;
        }

        .display-status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Monaco', monospace;
        }

        .display-status.connected {
            color: #4ade80;
        }

        .display-status.disconnected {
            color: #ef4444;
        }

        .footer-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'Monaco', monospace;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        class TeleprompterApp {
            constructor() {
                this.mode = null;
                this.sessionId = this.generateSessionId();
                this.script = localStorage.getItem('teleprompter_script') || '';
                this.scrollPosition = 0;
                this.isPlaying = false;
                this.scrollSpeed = 1;
                this.isConnected = false;
                this.isMirrored = localStorage.getItem('teleprompter_mirror') === 'true' || false;
                this.ws = null;
                this.clientType = null;
                this.init();
            }

            generateSessionId() {
                if (typeof localStorage !== 'undefined') {
                    let sessionId = localStorage.getItem('teleprompter_session');
                    if (!sessionId) {
                        sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        localStorage.setItem('teleprompter_session', sessionId);
                    }
                    return sessionId;
                }
                return 'session_' + Date.now();
            }

            init() {
                this.render();
                this.connectWebSocket();
            }

            connectWebSocket() {
                if (this.ws) this.ws.close();

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}?sessionId=${this.sessionId}&type=${this.clientType}`;

                try {
                    this.ws = new WebSocket(wsUrl);

                    this.ws.onopen = () => {
                        this.isConnected = true;
                        this.render();
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);

                            if (message.type === 'connected') {
                                this.isConnected = true;
                                if (message.currentState) {
                                    this.script = message.currentState.script || this.script;
                                    this.isPlaying = message.currentState.isPlaying || false;
                                    this.scrollSpeed = message.currentState.scrollSpeed || 1;
                                }
                                this.render();
                            } else if (message.type === 'sync') {
                                if (this.clientType === 'display') {
                                    this.script = message.script || this.script;
                                    this.isPlaying = message.isPlaying;
                                    this.scrollSpeed = message.scrollSpeed || 1;

                                    const content = document.querySelector('.teleprompter-content');
                                    if (content && this.isPlaying && message.isPlaying) {
                                        content.scrollTop += this.scrollSpeed * 2;
                                    }
                                    this.render();
                                }
                            }
                        } catch (error) {
                            console.error('Error parsing message:', error);
                        }
                    };

                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.isConnected = false;
                    };

                    this.ws.onclose = () => {
                        this.isConnected = false;
                        setTimeout(() => this.connectWebSocket(), 3000);
                    };
                } catch (error) {
                    console.error('Error creating WebSocket:', error);
                    this.isConnected = false;
                }
            }

            setMode(mode) {
                this.mode = mode;
                this.clientType = mode;

                if (mode === 'control' || mode === 'display') {
                    this.connectWebSocket();
                } else if (this.ws) {
                    this.ws.close();
                }

                this.render();
            }

            updateScript(text) {
                this.script = text;
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_script', this.script);
                }

                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'update',
                        data: { script: this.script }
                    }));
                }
            }

            togglePlayback() {
                this.isPlaying = !this.isPlaying;
                this.broadcast();
            }

            resetScroll() {
                this.scrollPosition = 0;
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop = 0;
                }
                this.broadcast();
            }

            updateSpeed(speed) {
                this.scrollSpeed = parseFloat(speed);
                this.broadcast();
            }

            toggleMirror() {
                this.isMirrored = !this.isMirrored;
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('teleprompter_mirror', this.isMirrored);
                }
                this.render();
            }

            broadcast() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'update',
                        data: {
                            script: this.script,
                            scrollPosition: this.scrollPosition,
                            isPlaying: this.isPlaying,
                            scrollSpeed: this.scrollSpeed
                        }
                    }));
                }
            }

            scrollUp() {
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop -= 100;
                }
            }

            scrollDown() {
                const content = document.querySelector('.teleprompter-content');
                if (content) {
                    content.scrollTop += 100;
                }
            }

            render() {
                const app = document.getElementById('app');

                if (!this.mode) {
                    app.innerHTML = `
                        <div class="mode-selection">
                            <h1>📺 Teleprompter</h1>
                            <p>Choose your role</p>
                            <div class="mode-buttons">
                                <button class="mode-btn" onclick="app.setMode('control')">
                                    <div class="mode-btn-icon">🎮</div>
                                    <div>Control</div>
                                </button>
                                <button class="mode-btn" onclick="app.setMode('display')">
                                    <div class="mode-btn-icon">📡</div>
                                    <div>Display</div>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (this.mode === 'control') {
                    this.renderControlPanel(app);
                } else if (this.mode === 'display') {
                    this.renderDisplayMode(app);
                }
            }

            renderControlPanel(app) {
                const statusClass = this.isConnected ? 'connected' : '';
                const statusText = this.isConnected ? 'Connected' : 'Connecting...';

                app.innerHTML = `
                    <div class="control-panel">
                        <div class="header">
                            <h1>📡 Control Panel</h1>
                            <div style="display: flex; gap: 16px; align-items: center;">
                                <div class="session-info">
                                    Session: ${this.sessionId.substr(-8)}
                                </div>
                                <button class="back-btn" onclick="app.setMode(null)">← Back</button>
                            </div>
                        </div>

                        <div class="status-message ${statusClass}">
                            ${statusText}
                        </div>

                        <div class="editor-section">
                            <div class="editor-header">
                                <h3>Script</h3>
                                <span style="font-size: 12px; color: #999;">${this.script.split('\n').length} lines</span>
                            </div>
                            <textarea class="script-textarea" 
                                placeholder="Paste or type your script here..."
                                oninput="app.updateScript(this.value)">${this.script}</textarea>
                        </div>

                        <div class="controls-section">
                            <button class="control-btn" onclick="app.togglePlayback()">
                                ${this.isPlaying ? '⏸ Pause' : '▶ Play'}
                            </button>
                            <button class="control-btn secondary" onclick="app.resetScroll()">
                                ↻ Reset
                            </button>

                            <div class="speed-control" style="grid-column: 1 / -1;">
                                <label for="speedSlider">Speed:</label>
                                <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" 
                                    value="${this.scrollSpeed}" onchange="app.updateSpeed(this.value)">
                                <span id="speedValue" style="font-size: 12px; min-width: 30px;">${this.scrollSpeed.toFixed(1)}x</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderDisplayMode(app) {
                const statusClass = this.isConnected ? 'connected' : 'disconnected';
                const statusText = this.isConnected ? 'Connected' : 'Connecting...';
                const mirrorStyle = this.isMirrored ? 'transform: scaleX(-1);' : '';

                app.innerHTML = `
                    <div class="display-mode">
                        <div class="teleprompter-screen">
                            <div class="teleprompter-content" id="teleContent" style="${mirrorStyle}">
                                ${this.script ? this.script : '<em style="opacity: 0.5;">Waiting for script...</em>'}
                            </div>
                            <div class="display-controls">
                                <button onclick="app.scrollUp()">↑ Up</button>
                                <button onclick="app.scrollDown()">↓ Down</button>
                                <button onclick="app.toggleMirror()" class="${this.isMirrored ? 'mirror-active' : ''}">
                                    🔄 Mirror
                                </button>
                                <button onclick="app.setMode(null)">← Exit</button>
                            </div>
                        </div>
                        <div class="display-status ${statusClass}">
                            ● ${statusText}
                        </div>
                        <div class="footer-info">
                            ${this.isMirrored ? '🔄 Mirrored' : 'Normal'} | Hover for controls
                        </div>
                    </div>
                `;
            }
        }

        const app = new TeleprompterApp();
        window.app = app;
    </script>
</body>
</html>
